[package]
name = "crud-api"
version = "0.1.0"
edition = "2024"

[dependencies]
aws-config = "1.12.0"
aws-sdk-s3 = "1.148.0"
axum = { version = "0.8.9", features = ["multipart"] }
bcrypt = "0.19.3"
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
jsonwebtoken =  { version = "11.1.0", default-features = false, features = ["rust_crypto"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "uuid", "chrono", "macros"] }
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.26.1", features = ["v4", "serde"] }
